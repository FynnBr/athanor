# Generated by athanor transmute ({{ label }}). Edits are overwritten.
include colors.conf
font_family {{ term_font }}
font_size {{ kitty_font_pt }}
bold_font {{ kitty_font_bold }}
# Kitty requires outline fonts, so use the regular face instead of bitmap Ttyp0.
italic_font {{ kitty_font_italic }}
bold_italic_font {{ kitty_font_bold_italic }}
# Keep the Powerline separators patched into Athanor's main faces.
symbol_map U+E000-U+E09F,U+E0D8-U+F8FF Symbols Nerd Font Mono
window_padding_width 14
cursor_shape block
cursor_blink_interval 0.5
mouse_hide_wait -1
# Keep Athanor's window titles and block cursor at shell prompts.
shell_integration no-title no-cursor
